// ---- vocab match game (Quizlet Match: start screen, every tile visible,
// tap two tiles that form a term/meaning pair and they clear off the board;
// a wrong pair adds a 1-second penalty; best time is kept per filter) ----
const MATCH_PENALTY_MS = 1000;
let matchCards = [];       // {uid, vocabIdx, side, text, cleared, clearing}
let matchSelected = [];    // up to 2 uids currently selected
let matchWrongIds = [];    // uids currently flashing red
let matchMoves = 0;
let matchLocked = false;
let matchStartTs = 0;
let matchPenaltyMs = 0;
let matchState = 'ready';  // ready | playing | done
let matchTimerHandle = null;

function matchBestKey(){ return `${vocabRound}|${vocabChapter}`; }
function fmtSec(ms){ return (ms/1000).toFixed(1) + '秒'; }
function matchElapsed(){ return Date.now() - matchStartTs + matchPenaltyMs; }

function buildMatchGame(){
  const pool = vocabPool().filter(i => VOCAB[i].gloss);
  const n = Math.min(6, pool.length);
  const chosen = shuffle(pool).slice(0, n);
  const cards = [];
  chosen.forEach((vi, i)=>{
    cards.push({uid:'t'+i, vocabIdx:vi, side:'term', text:VOCAB[vi].term, cleared:false, clearing:false});
    cards.push({uid:'g'+i, vocabIdx:vi, side:'gloss', text:VOCAB[vi].gloss, cleared:false, clearing:false});
  });
  matchCards = shuffle(cards);
  matchSelected = [];
  matchWrongIds = [];
  matchMoves = 0;
  matchLocked = false;
  matchPenaltyMs = 0;
  matchState = 'ready';
  if(matchTimerHandle){ clearInterval(matchTimerHandle); matchTimerHandle = null; }
}

function startMatchGame(){
  matchState = 'playing';
  matchStartTs = Date.now();
  matchPenaltyMs = 0;
  if(matchTimerHandle) clearInterval(matchTimerHandle);
  matchTimerHandle = setInterval(()=>{
    const el = document.getElementById('matchTimer');
    if(el && matchState==='playing') el.textContent = fmtSec(matchElapsed());
  }, 100);
  renderVocabMatch();
}

// Builds the match-game DOM exactly once per game (new game / mode switch /
// filter change / restart). Taps afterwards only toggle classes on the
// existing tile elements via syncMatchTiles() -- rebuilding the whole
// innerHTML on every tap was recreating the outer .card wrapper each time,
// which replays its mount animation (fadeInUp) and reads as a "bounce" on
// every interaction.
function renderVocabMatch(){
  const area = document.getElementById('vocabArea');
  if(VOCAB.length===0){
    area.innerHTML = `<div class="card empty">まだ単語が登録されていません。</div>`;
    return;
  }
  if(matchCards.length===0){
    area.innerHTML = `<div class="card empty">この条件の単語がないため、マッチゲームを作成できません。回・章の範囲を広げてみてください。</div>`;
    return;
  }
  const best = store.data.matchBest[matchBestKey()];
  if(matchState==='ready'){
    area.innerHTML = `
      <div class="card matchStart">
        <div class="matchStartIcon">⏱</div>
        <div class="term">マッチ</div>
        <div class="progress">すべての「英語」と「意味」を、できるだけ速くペアにして消していきましょう。<br>間違えると <b>+1秒</b> のペナルティ。</div>
        <div class="progress">${best ? `自己ベスト：<b>${fmtSec(best)}</b>` : 'まだ記録はありません'}</div>
        <div class="btnrow" style="justify-content:center"><button class="primary" id="matchStartBtn">ゲームを開始</button></div>
      </div>
    `;
    document.getElementById('matchStartBtn').onclick = startMatchGame;
    return;
  }
  area.innerHTML = `
    <div class="card">
      <div class="matchTop">
        <span>ペアになる「英語」と「意味」のタイルを2枚タップ</span>
        <span class="matchClock"><span id="matchTimer">${fmtSec(matchState==='playing' ? matchElapsed() : 0)}</span><span class="matchPenalty" id="matchPenalty"></span></span>
      </div>
      <div class="empty" id="matchDone" style="display:none"></div>
      <div class="matchGrid" id="matchGrid"></div>
    </div>
  `;
  const grid = document.getElementById('matchGrid');
  matchCards.forEach(c=>{
    const tile = document.createElement('div');
    tile.className = 'matchTile';
    tile.dataset.uid = c.uid;
    tile.textContent = c.text;
    tile.onclick = ()=> onMatchTileClick(c.uid);
    grid.appendChild(tile);
  });
  syncMatchTiles();
}

function finishMatchGame(){
  matchState = 'done';
  if(matchTimerHandle){ clearInterval(matchTimerHandle); matchTimerHandle = null; }
  const total = matchElapsed();
  const key = matchBestKey();
  const prev = store.data.matchBest[key];
  const isBest = !prev || total < prev;
  if(isBest){ store.data.matchBest[key] = total; store.save(); }
  const timerEl = document.getElementById('matchTimer');
  if(timerEl) timerEl.textContent = fmtSec(total);
  const doneEl = document.getElementById('matchDone');
  const grid = document.getElementById('matchGrid');
  if(grid) grid.style.display = 'none';
  doneEl.style.display = '';
  doneEl.innerHTML = `
    <div id="matchConf"></div>
    <div class="matchResult">${fmtSec(total)}</div>
    <div class="progress">${isBest ? (prev ? `🎉 自己ベスト更新！（前回のベスト ${fmtSec(prev)}）` : '🎉 初めての記録です！') : `自己ベスト：${fmtSec(prev)}`}</div>
    <div class="progress">うちペナルティ ${matchPenaltyMs/1000}秒・手数 ${matchMoves}</div>
    <div class="btnrow" style="justify-content:center"><button class="primary" id="matchAgain">もう一度</button></div>`;
  if(isBest) fireConfetti(document.getElementById('matchConf'));
  document.getElementById('matchAgain').onclick = ()=>{ buildMatchGame(); startMatchGame(); };
}

function syncMatchTiles(){
  matchCards.forEach(c=>{
    const tile = document.querySelector(`.matchTile[data-uid="${c.uid}"]`);
    if(!tile) return;
    tile.classList.toggle('selected', matchSelected.includes(c.uid));
    tile.classList.toggle('wrong', matchWrongIds.includes(c.uid));
    tile.classList.toggle('clearing', !!c.clearing);
    tile.classList.toggle('cleared', !!c.cleared);
  });
  if(matchState==='playing' && matchCards.every(c=>c.cleared)) finishMatchGame();
}

function flashMatchPenalty(){
  const el = document.getElementById('matchPenalty');
  if(!el) return;
  el.textContent = '+1秒';
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}

function onMatchTileClick(uid){
  if(matchLocked || matchState!=='playing') return;
  const card = matchCards.find(c=>c.uid===uid);
  if(!card || card.cleared) return;
  if(matchSelected.includes(uid)){
    matchSelected = matchSelected.filter(id=>id!==uid);
    syncMatchTiles();
    return;
  }
  if(matchSelected.length>=2) return;
  matchSelected.push(uid);
  syncMatchTiles();
  if(matchSelected.length===2){
    matchLocked = true;
    matchMoves++;
    const [a,b] = matchSelected.map(id=>matchCards.find(c=>c.uid===id));
    const isMatch = a.vocabIdx===b.vocabIdx && a.side!==b.side;
    if(isMatch){
      setTimeout(()=>{
        a.clearing = true; b.clearing = true;
        syncMatchTiles();
        setTimeout(()=>{
          a.cleared = true; b.cleared = true;
          matchSelected = [];
          matchLocked = false;
          syncMatchTiles();
        }, 350);
      }, 120);
    } else {
      matchPenaltyMs += MATCH_PENALTY_MS;
      flashMatchPenalty();
      matchWrongIds = [a.uid, b.uid];
      syncMatchTiles();
      setTimeout(()=>{
        matchWrongIds = [];
        matchSelected = [];
        matchLocked = false;
        syncMatchTiles();
      }, 450);
    }
  }
}

// ---- vocab learn mode (Quizlet Learn: rounds of up to 7 terms; a new term is
// asked as multiple choice, a familiar one as a written answer; a term is
// mastered after one correct written answer; misses come back later in the
// same round). Per-term level is kept in store.data.learn:
//   0 / missing = 未学習, 1 = 学習中（4択は正解済み）, 2 = 習得 ----
const LEARN_ROUND_SIZE = 7;
let learnQueue = [];        // vocab indices still to ask in this round
let learnRoundItems = [];   // vocab indices in this round (for the summary)
let learnRoundNo = 0;
let learnRoundMissed = {};  // idx -> true if missed at least once this round
let learnCurrent = null;    // {idx, type:'mc'|'written', options?}
let learnAnswered = false;

function learnLevel(i){ return store.data.learn[i] || 0; }
function learnPool(){ return vocabPool().filter(i => VOCAB[i].gloss); }

function buildLearnRound(){
  const pool = learnPool();
  const remaining = pool.filter(i => learnLevel(i) < 2);
  // Terms already in progress come first, then new ones, like Quizlet.
  const inProgress = shuffle(remaining.filter(i => learnLevel(i) === 1));
  const fresh = remaining.filter(i => learnLevel(i) === 0);
  learnRoundItems = inProgress.concat(fresh).slice(0, LEARN_ROUND_SIZE);
  learnQueue = shuffle(learnRoundItems.slice());
  learnRoundMissed = {};
  learnRoundNo++;
  learnCurrent = null;
}

function resetLearnForPool(){
  learnPool().forEach(i => { delete store.data.learn[i]; });
  store.save();
  learnRoundNo = 0;
  buildLearnRound();
  renderVocabLearn();
}

function normalizeAnswer(s){
  return (s||'').toLowerCase()
    .replace(/[’‘`]/g, "'")
    .replace(/[〜~…]/g, ' ')
    .replace(/[.,!?;:"“”()（）]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function learnCounts(){
  const pool = learnPool();
  const c = {total: pool.length, fresh:0, learning:0, mastered:0};
  pool.forEach(i => { const l = learnLevel(i); if(l>=2) c.mastered++; else if(l===1) c.learning++; else c.fresh++; });
  return c;
}

function learnHeaderHtml(){
  const c = learnCounts();
  const pct = n => c.total ? (n/c.total*100) : 0;
  return `
    <div class="learnHead">
      <div class="learnBar">
        <span class="lbMastered" style="width:${pct(c.mastered)}%"></span><span class="lbLearning" style="width:${pct(c.learning)}%"></span>
      </div>
      <div class="learnLegend">
        <span><i class="dot dFresh"></i>未学習 ${c.fresh}</span>
        <span><i class="dot dLearning"></i>学習中 ${c.learning}</span>
        <span><i class="dot dMastered"></i>習得 ${c.mastered}</span>
        <label class="learnOpt"><input type="checkbox" id="learnWrittenOpt" ${store.data.learnWritten ? 'checked' : ''}> 記述問題を出す</label>
      </div>
    </div>`;
}

function bindLearnHeader(){
  const opt = document.getElementById('learnWrittenOpt');
  if(opt) opt.onchange = (e)=>{ store.data.learnWritten = e.target.checked; store.save(true); if(!learnAnswered){ learnCurrent = null; renderVocabLearn(); } };
}

function renderVocabLearn(){
  const area = document.getElementById('vocabArea');
  if(VOCAB.length===0){
    area.innerHTML = `<div class="card empty">まだ単語が登録されていません。</div>`;
    return;
  }
  const pool = learnPool();
  if(pool.length===0){
    area.innerHTML = `<div class="card empty">この条件の単語がありません。回・章の範囲を広げてみてください。</div>`;
    return;
  }
  const c = learnCounts();
  if(c.mastered === c.total){
    area.innerHTML = learnHeaderHtml() + `
      <div class="card empty" id="learnAllDone">
        <div class="term">🎉 すべての語を習得しました！</div>
        <div class="progress">この範囲の ${c.total} 語をすべて覚えました。</div>
        <div class="btnrow" style="justify-content:center"><button class="primary" id="learnRestart">最初からやり直す</button></div>
      </div>`;
    fireConfetti(document.getElementById('learnAllDone'));
    document.getElementById('learnRestart').onclick = resetLearnForPool;
    bindLearnHeader();
    return;
  }
  if(learnRoundItems.length===0) buildLearnRound();
  if(learnQueue.length===0){ renderLearnRoundSummary(); return; }
  if(!learnCurrent){
    const idx = learnQueue[0];
    const written = learnLevel(idx) >= 1 && store.data.learnWritten;
    learnCurrent = {idx, type: written ? 'written' : 'mc'};
    if(!written){
      const others = shuffle([...new Set(VOCAB.filter((v,j)=>j!==idx && v.gloss && v.gloss!==VOCAB[idx].gloss).map(v=>v.gloss))]).slice(0,3);
      learnCurrent.options = shuffle([VOCAB[idx].gloss, ...others]);
    }
  }
  learnAnswered = false;
  const item = VOCAB[learnCurrent.idx];
  const done = learnRoundItems.length - learnQueue.length;
  const top = `${learnHeaderHtml()}
    <div class="progress">ラウンド ${learnRoundNo}：${done} / ${learnRoundItems.length}</div>`;
  if(learnCurrent.type==='mc'){
    area.innerHTML = top + `
      <div class="card learnCard">
        <div class="learnLabel">英語</div>
        <div class="learnPrompt">${item.term}</div>
        <div class="learnLabel">正しい意味を選んでください</div>
        <div id="learnChoices">${learnCurrent.options.map((o,k)=>`<button class="choice" data-k="${k}"><span class="keyhint">${k+1}</span>${escapeHtml(o)}</button>`).join('')}</div>
        <div id="learnFeedback"></div>
        <div class="btnrow" id="learnSkipRow"><button id="learnDontKnow">わからない</button></div>
      </div>`;
    document.querySelectorAll('#learnChoices .choice').forEach(b=>{
      b.onclick = ()=> answerLearnMc(learnCurrent.options[Number(b.dataset.k)]);
    });
  } else {
    area.innerHTML = top + `
      <div class="card learnCard">
        <div class="learnLabel">意味</div>
        <div class="learnPrompt">${item.gloss}</div>
        <div class="learnLabel">英語で答えてください</div>
        <input type="text" class="learnInput" id="learnInput" placeholder="英語を入力" autocomplete="off" autocapitalize="off" spellcheck="false">
        <div id="learnFeedback"></div>
        <div class="btnrow" id="learnSkipRow"><button class="primary" id="learnSubmit">答える</button><button id="learnDontKnow">わからない</button></div>
      </div>`;
    const input = document.getElementById('learnInput');
    input.focus();
    input.onkeydown = (e)=>{ if(e.key==='Enter' && !e.isComposing){ e.preventDefault(); if(!learnAnswered) answerLearnWritten(input.value); } };
    document.getElementById('learnSubmit').onclick = ()=> answerLearnWritten(input.value);
  }
  document.getElementById('learnDontKnow').onclick = ()=>{
    if(learnCurrent.type==='mc') answerLearnMc(null); else answerLearnWritten(null);
  };
  bindLearnHeader();
}

const PRAISE = ['正解！', 'その調子！', 'すばらしい！', 'よくできました！', '完璧です！'];

function learnCorrect(){
  const idx = learnCurrent.idx;
  const lvl = learnLevel(idx);
  // With written questions off, a second correct multiple choice masters the term.
  store.data.learn[idx] = Math.min(2, lvl + 1);
  store.save();
  learnQueue.shift();
}

function learnWrong(){
  const idx = learnCurrent.idx;
  store.data.learn[idx] = 0;
  store.save();
  learnRoundMissed[idx] = true;
  learnQueue.shift();
  learnQueue.push(idx);   // ask again later in this round
}

function learnNext(){ hideSheet(); learnCurrent = null; if(vocabMode==='learn') renderVocabLearn(); }

function resetLearnSession(){
  learnQueue = []; learnRoundItems = []; learnRoundNo = 0; learnRoundMissed = {}; learnCurrent = null;
}

function praise(){ return PRAISE[Math.floor(Math.random()*PRAISE.length)]; }

function learnContinueButton(){
  return {id:'learnContinue', label:'続ける <span class="keyhint inv">Enter</span>', primary:true, onclick: learnNext};
}

function answerLearnMc(opt){
  if(learnAnswered) return;
  learnAnswered = true;
  const item = VOCAB[learnCurrent.idx];
  const ok = opt === item.gloss;
  document.querySelectorAll('#learnChoices .choice').forEach(b=>{
    b.disabled = true;
    const o = learnCurrent.options[Number(b.dataset.k)];
    if(o === item.gloss) b.classList.add('correct');
    else if(o === opt) b.classList.add('wrong');
  });
  document.getElementById('learnSkipRow').innerHTML = '';
  if(ok){
    learnCorrect();
    showSheet('good', praise(), '', [], 900);
    setTimeout(learnNext, 900);
  } else {
    learnWrong();
    showSheet('bad', opt===null ? 'あとでもう一度出題します' : 'おしい！',
      `正解：<b>${escapeHtml(item.gloss)}</b>`, [learnContinueButton()]);
  }
}

function answerLearnWritten(value){
  if(learnAnswered) return;
  const item = VOCAB[learnCurrent.idx];
  if(value !== null && !value.trim()) return;
  learnAnswered = true;
  const input = document.getElementById('learnInput');
  input.disabled = true;
  document.getElementById('learnSkipRow').innerHTML = '';
  const ok = value !== null && normalizeAnswer(value) === normalizeAnswer(item.term);
  if(ok){
    input.classList.add('good');
    learnCorrect();
    showSheet('good', praise(), `<b>${escapeHtml(item.term)}</b>`, [], 1100);
    setTimeout(learnNext, 1100);
    return;
  }
  input.classList.add('bad');
  if(value !== null){
    document.getElementById('learnFeedback').innerHTML =
      `<div class="learnAns bad"><span>あなたの答え</span>${escapeHtml(value)}</div>`;
  }
  learnWrong();
  const buttons = [learnContinueButton()];
  if(value !== null){
    buttons.push({label:'正解にする（入力ミスだった）', onclick: ()=>{
      // Undo the miss: take the re-queued copy out and count it as correct.
      const idx = learnCurrent.idx;
      learnQueue.pop();
      learnQueue.unshift(idx);
      delete learnRoundMissed[idx];
      store.data.learn[idx] = 1;
      learnCorrect();
      learnNext();
    }});
  }
  showSheet('bad', value===null ? 'あとでもう一度出題します' : 'おしい！',
    `正解：<b>${escapeHtml(item.term)}</b>`, buttons);
}

document.addEventListener('keydown', (e)=>{
  if(vocabMode!=='learn' || !document.getElementById('panel-vocab').classList.contains('active')) return;

// ---- vocab test mode (Quizlet Test: choose question count, question types
// and direction; answer every question on one page, then submit for a score
// and a per-question review). Results are appended to store.data.testHistory.
const TEST_TYPES = [
  {key:'tf', label:'○×'},
  {key:'mc', label:'4択'},
  {key:'written', label:'記述'},
  {key:'matching', label:'マッチング'},
];
let testState = 'setup';     // setup | taking | result
let testQuestions = [];      // see buildTest()
let testStartTs = 0;
let testRetakePool = null;   // vocab indices for "間違えた語で再テスト"
let testLastResult = null;

function testSettings(){ return store.data.testSettings; }

function testPool(){ return (testRetakePool || vocabPool()).filter(i => VOCAB[i].gloss); }

function testSide(idx, dir){
  // dir 'en' = show English, answer with meaning; 'jp' = show meaning, answer with English
  return dir === 'en' ? {prompt: VOCAB[idx].term, answer: VOCAB[idx].gloss, key:'gloss'}
                      : {prompt: VOCAB[idx].gloss, answer: VOCAB[idx].term, key:'term'};
}

function pickDir(){
  const d = testSettings().dir;
  return d === 'mix' ? (Math.random() < 0.5 ? 'en' : 'jp') : d;
}

function distractors(idx, key, n){
  const right = VOCAB[idx][key];
  return shuffle([...new Set(VOCAB.filter((v,j)=>j!==idx && v.gloss && v[key]!==right).map(v=>v[key]))]).slice(0, n);
}

function buildTest(){
  const st = testSettings();
  const pool = shuffle(testPool());
  const n = Math.min(st.count === 'all' ? pool.length : Number(st.count), pool.length);
  const chosen = pool.slice(0, n);
  let types = TEST_TYPES.map(t=>t.key).filter(k => st.types[k]);
  if(types.length === 0) types = ['mc'];
  // Split the chosen terms across the enabled types as evenly as possible.
  const buckets = {}; types.forEach(t => buckets[t] = []);
  chosen.forEach((idx, k) => buckets[types[k % types.length]].push(idx));
  // Matching needs at least 2 terms; a lone term becomes multiple choice.
  if(buckets.matching && buckets.matching.length === 1){
    (buckets.mc = buckets.mc || []).push(buckets.matching.pop());
  }
  const qs = [];
  (buckets.tf || []).forEach(idx=>{
    const dir = pickDir(); const s = testSide(idx, dir);
    const truth = Math.random() < 0.5;
    const shown = truth ? s.answer : (distractors(idx, s.key, 1)[0] || s.answer);
    qs.push({type:'tf', idx, dir, prompt:s.prompt, shown, correct: shown === s.answer, answer:null});
  });
  (buckets.mc || []).forEach(idx=>{
    const dir = pickDir(); const s = testSide(idx, dir);
    qs.push({type:'mc', idx, dir, prompt:s.prompt, right:s.answer,
             options: shuffle([s.answer, ...distractors(idx, s.key, 3)]), answer:null});
  });
  (buckets.written || []).forEach(idx=>{
    qs.push({type:'written', idx, prompt:VOCAB[idx].gloss, right:VOCAB[idx].term, answer:''});
  });
  const m = buckets.matching || [];
  for(let k=0; k<m.length; k+=5){
    const group = m.slice(k, k+5);
    if(group.length === 1){ // leftover single term
      const idx = group[0], s = testSide(idx, 'en');
      qs.push({type:'mc', idx, dir:'en', prompt:s.prompt, right:s.answer, options: shuffle([s.answer, ...distractors(idx, 'gloss', 3)]), answer:null});
      continue;
    }
    qs.push({type:'matching', items: group, options: shuffle(group.map(i=>VOCAB[i].gloss)), answer: group.map(()=>'')});
  }
  testQuestions = qs;
  testStartTs = Date.now();
  testState = 'taking';
}

function testQuestionCount(){
  return testQuestions.reduce((n,q)=> n + (q.type==='matching' ? q.items.length : 1), 0);
}

function testAnsweredCount(){
  return testQuestions.reduce((n,q)=>{
    if(q.type==='matching') return n + q.answer.filter(a=>a!=='').length;
    if(q.type==='written') return n + (q.answer.trim() ? 1 : 0);
    return n + (q.answer!==null ? 1 : 0);
  }, 0);
}

// ---- test UI: setup → one question per screen (focus mode) → result ----
const TEST_TYPE_INFO = {
  tf:       {icon:'⭕', name:'○×', desc:'意味が合っているか判断'},
  mc:       {icon:'🔤', name:'4択', desc:'4つの中から選ぶ'},

};
let testPos = 0;            // index into testQuestions
let testMatchPick = null;   // matching: row index waiting for a meaning
let testReviewFilter = 'all';

function setExamMode(on){ document.body.classList.toggle('examMode', !!on); }

function renderVocabTest(){
  const area = document.getElementById('vocabArea');

  }

  if(testState==='taking') return renderTestTaking();
  if(testState==='result') return renderTestResult();
  renderTestSetup();

function testHistoryHere(){
  return store.data.testHistory.filter(h => h.round===vocabRound && h.chapter===vocabChapter);
}

function historyBars(hist){
  const last = hist.filter(h=>!h.retake).slice(-8);
  if(!last.length) return '';
  return `<div class="histBars">${last.map(h=>`
    <div class="hb"><span class="hbVal">${h.pct}</span><span class="hbBar"><i style="height:${Math.max(6,h.pct)}%" class="${h.pct>=80?'g':(h.pct>=50?'w':'b')}"></i></span><span class="hbDate">${new Date(h.ts).getMonth()+1}/${new Date(h.ts).getDate()}</span></div>`).join('')}</div>`;
}

function renderTestSetup(){
  const area = document.getElementById('vocabArea');

    return;
  }
  const counts = [5,10,15,20].filter(c => c < pool.length);
  const hist = testHistoryHere();
  const full = hist.filter(h=>!h.retake);
  const best = full.length && !testRetakePool ? Math.max(...full.map(h=>h.pct)) : null;
  const n = st.count==='all' || !counts.includes(Number(st.count)) ? pool.length : Number(st.count);
  area.innerHTML = `
    <div class="card testHero">
      <div class="testHeroLion">${LION_SVG}</div>
      <div class="testHeroText">
        <div class="testHeroTitle">${testRetakePool ? '間違えた語で再テスト' : '単語テスト'}</div>
        <div class="testHeroSub">${testRetakePool ? `前回まちがえた ${pool.length} 語` : `${vocabSet==='all' ? 'すべての単語' : vocabRound}・${pool.length}語`}</div>
        ${best!==null ? `<span class="bestChip">🏆 ベスト ${best}%</span>` : ''}
      </div>
    </div>

    <div class="setupSec">
      <div class="setupLabel">問題数 <b>${n}問</b></div>
      <div class="chipRow" id="tCount">
        ${counts.map(c=>`<button data-v="${c}" class="${n===c?'on':''}">${c}</button>`).join('')}
        <button data-v="all" class="${n===pool.length?'on':''}">全部 ${pool.length}</button>
      </div>
    </div>

    <div class="setupSec">
      <div class="setupLabel">出題形式</div>
      <div class="typeGrid" id="tTypes">
        ${TEST_TYPES.map(t=>{ const i = TEST_TYPE_INFO[t.key]; return `
          <button class="typeTile ${st.types[t.key]?'on':''}" data-k="${t.key}">
            <span class="ttIcon">${i.icon}</span><span class="ttName">${i.name}</span><span class="ttDesc">${i.desc}</span><span class="ttCheck">✓</span>
          </button>`; }).join('')}
      </div>
    </div>

    <div class="setupSec">
      <div class="setupLabel">問題の向き</div>
      <div class="seg" id="tDir">
        <button data-v="en" class="${st.dir==='en'?'on':''}">英語 → 意味</button>
        <button data-v="jp" class="${st.dir==='jp'?'on':''}">意味 → 英語</button>
        <button data-v="mix" class="${st.dir==='mix'?'on':''}">ミックス</button>
      </div>
    </div>

    <button class="primary big block startBtn" id="tStart">テストをはじめる</button>
    ${testRetakePool ? '<button class="ghost block" id="tAll">セット全体のテストに戻す</button>' : ''}

    ${full.length ? `<div class="setupSec"><div class="setupLabel">これまでの成績</div><div class="card histCard">${historyBars(hist)}</div></div>` : ''}
  `;
  const save = ()=>{ store.save(true); renderTestSetup(); };
  area.querySelectorAll('#tCount button').forEach(b=> b.onclick = ()=>{ st.count = b.dataset.v==='all' ? 'all' : Number(b.dataset.v); save(); });
  area.querySelectorAll('#tDir button').forEach(b=> b.onclick = ()=>{ st.dir = b.dataset.v; save(); });
  area.querySelectorAll('#tTypes .typeTile').forEach(b=> b.onclick = ()=>{
    st.types[b.dataset.k] = !st.types[b.dataset.k];
    if(!Object.values(st.types).some(Boolean)) st.types[b.dataset.k] = true; // keep at least one
    save();
  });
  document.getElementById('tStart').onclick = startTest;
  const all = document.getElementById('tAll');
  if(all) all.onclick = ()=>{ testRetakePool = null; renderTestSetup(); };
}

function startTest(){
  buildTest();
  testPos = 0; testMatchPick = null;
  renderVocabTest();
  window.scrollTo({top:0});
}

function isAnswered(q){
  if(q.type==='matching') return q.answer.every(a=>a!=='');
  if(q.type==='written') return !!q.answer.trim();
  return q.answer !== null;
}

function questionNumberLabel(qi){
  // matching groups count as several questions
  let no = 1;
  for(let k=0;k<qi;k++) no += testQuestions[k].type==='matching' ? testQuestions[k].items.length : 1;
  const q = testQuestions[qi];
  return q.type==='matching' ? `${no}–${no+q.items.length-1}` : String(no);
}

function renderTestTaking(){
  const area = document.getElementById('vocabArea');
  const q = testQuestions[testPos];
  const total = testQuestionCount(), answered = testAnsweredCount();
  const last = testPos === testQuestions.length-1;
  const info = TEST_TYPE_INFO[q.type];
  let body = '';
  if(q.type==='tf'){
    body = `
      <div class="qLabel">${q.dir==='en' ? 'この英語の意味は合っている？' : 'この意味の英語は合っている？'}</div>
      <div class="qPrompt">${escapeHtml(q.prompt)}</div>
      <div class="qShown">${escapeHtml(q.shown)}</div>
      <div class="tfBig">
        <button class="tfO ${q.answer===true?'on':''}" data-v="1"><span>○</span>正しい</button>
        <button class="tfX ${q.answer===false?'on':''}" data-v="0"><span>×</span>まちがい</button>
      </div>`;
  } else if(q.type==='mc'){
    body = `
      <div class="qLabel">${q.dir==='en' ? '正しい意味を選んでください' : '正しい英語を選んでください'}</div>
      <div class="qPrompt">${escapeHtml(q.prompt)}</div>
      <div class="optList">${q.options.map((o,k)=>`<button class="opt ${q.answer===o?'on':''}" data-k="${k}"><span class="optKey">${'ABCD'[k]}</span><span>${escapeHtml(o)}</span></button>`).join('')}</div>`;
  } else if(q.type==='written'){
    body = `
      <div class="qLabel">この意味の英語を入力してください</div>
      <div class="qPrompt">${escapeHtml(q.prompt)}</div>
      <input type="text" class="learnInput qInput" id="tInput" value="${escapeHtml(q.answer)}" placeholder="英語で入力" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="qHint">Enter で次の問題へ</div>`;
  } else {
    const used = q.answer.filter(Boolean);
    body = `
      <div class="qLabel">英語をタップ → 合う意味をタップ</div>
      <div class="mtRows">${q.items.map((idx,k)=>`
        <button class="mtRow ${testMatchPick===k?'pick':''} ${q.answer[k]?'filled':''}" data-k="${k}">
          <span class="mtTerm">${escapeHtml(VOCAB[idx].term)}</span>
          <span class="mtSlot">${q.answer[k] ? escapeHtml(q.answer[k]) : 'タップして選ぶ'}</span>
        </button>`).join('')}</div>
      <div class="mtChips">${q.options.map((o,k)=>`<button class="mtChip ${used.includes(o)?'used':''}" data-k="${k}">${escapeHtml(o)}</button>`).join('')}</div>`;
  }
  area.innerHTML = `
    <div class="examTop">
      <button class="examClose" id="tQuit" aria-label="テストを中断">✕</button>
      <div class="examProg"><span style="width:${answered/total*100}%"></span></div>
      <span class="examCount">${answered}/${total}</span>
    </div>
    <div class="examDots">${testQuestions.map((x,k)=>`<button class="dot ${isAnswered(x)?'done':''} ${k===testPos?'cur':''}" data-k="${k}">${questionNumberLabel(k)}</button>`).join('')}</div>
    <div class="examCard card" id="examCard">
      <span class="qType">${info.icon} ${info.name}</span>
      ${body}
    </div>
    <div class="examNav">
      <button id="tPrev" ${testPos===0?'disabled':''}>‹ 前へ</button>
      ${last ? `<button class="primary" id="tFinish">提出する</button>` : `<button class="primary" id="tNext">次へ ›</button>`}
    </div>`;

  const card = document.getElementById('examCard');
  const advance = ()=>{ setTimeout(()=>{ if(testState==='taking' && testPos < testQuestions.length-1){ testPos++; renderTestTaking(); } else renderTestTaking(); }, 260); };
  if(q.type==='tf'){
    card.querySelectorAll('.tfBig button').forEach(b=> b.onclick = ()=>{ q.answer = b.dataset.v==='1'; card.querySelectorAll('.tfBig button').forEach(x=>x.classList.toggle('on', x===b)); advance(); });
  } else if(q.type==='mc'){
    card.querySelectorAll('.opt').forEach(b=> b.onclick = ()=>{ q.answer = q.options[Number(b.dataset.k)]; card.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on', x===b)); advance(); });
  } else if(q.type==='written'){
    const input = document.getElementById('tInput');
    input.oninput = ()=>{ q.answer = input.value; };
    input.onkeydown = (e)=>{ if(e.key==='Enter' && !e.isComposing){ e.preventDefault(); if(last) finishTest(); else { testPos++; renderTestTaking(); } } };
    setTimeout(()=>input.focus(), 50);
  } else {
    card.querySelectorAll('.mtRow').forEach(b=> b.onclick = ()=>{
      const k = Number(b.dataset.k);
      if(q.answer[k] && testMatchPick!==k){ q.answer[k] = ''; }   // tap a filled row to clear it
      testMatchPick = k; renderTestTaking();
    });
    card.querySelectorAll('.mtChip').forEach(b=> b.onclick = ()=>{
      const o = q.options[Number(b.dataset.k)];
      let k = testMatchPick;
      if(k===null) k = q.answer.findIndex(a=>!a);
      if(k<0) return;
      const prev = q.answer.indexOf(o); if(prev>=0) q.answer[prev] = '';
      q.answer[k] = o;
      const nextEmpty = q.answer.findIndex(a=>!a);
      testMatchPick = nextEmpty>=0 ? nextEmpty : null;
      renderTestTaking();
    });
  }
  area.querySelectorAll('.examDots .dot').forEach(d=> d.onclick = ()=>{ testPos = Number(d.dataset.k); testMatchPick = null; renderTestTaking(); });
  document.getElementById('tPrev').onclick = ()=>{ if(testPos>0){ testPos--; testMatchPick=null; renderTestTaking(); } };
  const nx = document.getElementById('tNext'); if(nx) nx.onclick = ()=>{ testPos++; testMatchPick=null; renderTestTaking(); };
  const fin = document.getElementById('tFinish'); if(fin) fin.onclick = finishTest;

  const left = testQuestionCount() - testAnsweredCount();

      {label:'戻って解く', onclick: ()=>{ hideSheet(); testPos = testQuestions.findIndex(q=>!isAnswered(q)); renderTestTaking(); }},
    ]);
    return;
  }

document.addEventListener('keydown', (e)=>{
  if(testState!=='taking' || vocabMode!=='test' || !document.body.classList.contains('examMode')) return;
  if(e.target && e.target.tagName==='INPUT') return;
  const q = testQuestions[testPos]; if(!q) return;
  const k = e.key.toLowerCase();
  if(k==='arrowright' && testPos<testQuestions.length-1){ testPos++; testMatchPick=null; renderTestTaking(); }
  else if(k==='arrowleft' && testPos>0){ testPos--; testMatchPick=null; renderTestTaking(); }
  else if(q.type==='mc'){
    const i = '1234'.indexOf(k)>=0 ? '1234'.indexOf(k) : 'abcd'.indexOf(k);
    if(i>=0){ const b = document.querySelector(`.opt[data-k="${i}"]`); if(b) b.click(); }
  } else if(q.type==='tf'){
    if(k==='o' || k==='1'){ const b = document.querySelector('.tfO'); if(b) b.click(); }
    if(k==='x' || k==='2'){ const b = document.querySelector('.tfX'); if(b) b.click(); }
  }
});

function gradeTitle(pct){
  if(pct===100) return {t:'天才！', s:'全問正解、パーフェクトです 🎉'};
  if(pct>=80) return {t:'すばらしい！', s:'あと少しで満点。間違えた語をおさえよう'};
  if(pct>=60) return {t:'いい調子！', s:'間違えた語を復習すれば、もっと伸びます'};
  if(pct>=30) return {t:'その調子！', s:'学習モードで間違えた語を覚えてから再挑戦しよう'};
  return {t:'ここからスタート！', s:'まずはカードや学習モードで単語に慣れよう'};
}

function gradeTest(){
  const rows = [];
  testQuestions.forEach(q=>{
    if(q.type==='tf'){
      rows.push({q, idx:q.idx, ok: q.answer!==null && q.answer===q.correct,
        yours: q.answer===null ? '（未回答）' : (q.answer ? '○ 正しい' : '× 誤り'),
        right: q.correct ? '○ 正しい' : `× 誤り（正しくは「${testSide(q.idx, q.dir).answer}」）`});
    } else if(q.type==='mc'){
      rows.push({q, idx:q.idx, ok: q.answer===q.right, yours: q.answer===null ? '（未回答）' : q.answer, right:q.right});
    } else if(q.type==='written'){
      rows.push({q, idx:q.idx, ok: normalizeAnswer(q.answer)===normalizeAnswer(q.right) && !!q.answer.trim(),
        yours: q.answer.trim() || '（未回答）', right:q.right});
    } else {
      q.items.forEach((idx,k)=> rows.push({q, idx, k, ok: q.answer[k]===VOCAB[idx].gloss,
        yours: q.answer[k] || '（未回答）', right: VOCAB[idx].gloss}));
    }
  });
  return rows;
}

function submitTest(){
  const rows = gradeTest();
  const correct = rows.filter(r=>r.ok).length;
  const total = rows.length;
  const pct = total ? Math.round(correct/total*100) : 0;
  const prevTests = store.data.testHistory.filter(h => h.round===vocabRound && h.chapter===vocabChapter && !h.retake);
  const prevPct = !testRetakePool && prevTests.length ? prevTests[prevTests.length-1].pct : null;
  testLastResult = {rows, correct, total, pct, prevPct, ms: Date.now()-testStartTs};
  testReviewFilter = 'all';
  store.data.testHistory.push({ts: Date.now(), round: vocabRound, chapter: vocabChapter, correct, total, pct, retake: !!testRetakePool});
  if(store.data.testHistory.length > 50) store.data.testHistory = store.data.testHistory.slice(-50);
  store.save();
  testState = 'result';
  renderVocabTest();
  window.scrollTo({top:0});
}

let kotestOrder = [];

let kotestAnswered = false;

function buildKotestOrder(){
  kotestOrder = shuffle(KOTEST.map((_,i)=>i).filter(i => practiceRound==='all' || KOTEST[i].round===practiceRound));
  kotestIdx = 0;
}

function kotestChoices(item){
  const ans = item.answer;
  const isShort = ans.split(' ').length === 1 && ans.length <= 6;
  const sameBucket = [...new Set(KOTEST.map(x=>x.answer))].filter(a=>{
    const aShort = a.split(' ').length === 1 && a.length <= 6;
    return aShort === isShort && a.toLowerCase() !== ans.toLowerCase();
  });
  const decoys = shuffle(sameBucket).slice(0,3);
  return shuffle([ans, ...decoys]);
}

function renderKotest(){
  const area = document.getElementById('kotestArea');
  if(KOTEST.length===0){
    area.innerHTML = `<div class="card empty">まだ問題が登録されていません。</div>`;
    return;
  }
  if(kotestOrder.length===0){
    area.innerHTML = `<div class="card empty">このセットには小テストの問題がありません。</div>`;
    return;
  }
  if(kotestIdx >= kotestOrder.length){
    area.innerHTML = `<div class="card empty" id="kotestDoneCard">小テスト対策は以上です。お疲れ様でした。<div class="btnrow" style="justify-content:center"><button class="primary" id="restartKotest">もう一度</button></div></div>`;
    fireConfetti(document.getElementById('kotestDoneCard'));
    document.getElementById('restartKotest').onclick = ()=>{ buildKotestOrder(); renderKotest(); };
    return;
  }
  const ki = kotestOrder[kotestIdx];
  const item = KOTEST[ki];
  kotestAnswered = false;
  area.innerHTML = `
    <div class="progress">${kotestIdx+1} / ${kotestOrder.length}：空欄に入る語句を選んでください</div>
    <div class="card">
      <div class="en" style="font-size:17px">${item.en}</div>
      <div class="jp">${item.jp || ''}</div>
      <div id="kChoiceArea" style="margin-top:14px"></div>
      <div id="kExplain" style="display:none" class="explain"></div>
    </div>
  `;
  const choiceArea = document.getElementById('kChoiceArea');
  kotestChoices(item).forEach(opt=>{
    const b = document.createElement('button');
    b.className = 'choice';
    b.textContent = opt;
    b.onclick = ()=>{
      if(kotestAnswered) return;
      kotestAnswered = true;
      const correct = opt === item.answer;
      store.data.kotestScore.total++;
      if(correct){ store.data.kotestScore.correct++; delete store.data.kotestWrong[ki]; }
      else{ store.data.kotestWrong[ki] = true; }
      store.save(); updateStats();
      Array.from(choiceArea.children).forEach(c=>{
        c.disabled = true;
        if(c.textContent === item.answer) c.classList.add('correct');
        else if(c===b) c.classList.add('wrong');
      });
      if(item.explain){
        const ex = document.getElementById('kExplain');
        ex.style.display = 'block';
        ex.textContent = item.explain;
      }
      const nextBtn = document.createElement('button');
      nextBtn.className = 'primary';
      nextBtn.textContent = '次へ';
      nextBtn.style.marginTop = '14px';
      nextBtn.onclick = ()=>{ kotestIdx++; renderKotest(); };
      choiceArea.appendChild(nextBtn);
    };
    choiceArea.appendChild(b);
  });
}

function todayKey(d){
  d = d || new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function markStudied(){ store.data.days[todayKey()] = true; }
function streakCount(){
  let n = 0; const d = new Date();
  // Today not studied yet doesn't break the streak until the day is over.
  if(!store.data.days[todayKey(d)]) d.setDate(d.getDate()-1);
  while(store.data.days[todayKey(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}

function goTo(nav, sub){
  hideSheet();

  if(nav !== 'practice'){
    document.getElementById('practiceSeg').style.display = 'none';

      if(!practiceSet){ practiceSet = newestRound(practiceRounds()); practiceRound = practiceSet; saveSets(); rebuildPractice(); }

function roundStats(r){
  const idxs = VOCAB.map((_,i)=>i).filter(i => r==='all' || VOCAB[i].round===r);
  const mastered = idxs.filter(i => (store.data.learn[i]||0) >= 2).length;
  const learning = idxs.filter(i => (store.data.learn[i]||0) === 1).length;
  const tests = store.data.testHistory.filter(h => h.round===r && !h.retake);
  const chapters = [...new Set(idxs.map(i=>VOCAB[i].chapter))].sort((a,b)=>a-b);
  return {total: idxs.length, mastered, learning, best: tests.length ? Math.max(...tests.map(h=>h.pct)) : null, chapters};
}

function lastExportLabel(){
  let t = null;

  if(!t) return '<span class="badTxt">まだバックアップを保存していません</span>';
  const days = Math.floor((Date.now()-t)/86400000);
  const when = new Date(t).toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'});
  return days >= 14 ? `<span class="badTxt">最後の保存：${when}（${days}日前）。そろそろ保存がおすすめです</span>` : `最後の保存：${when}${days ? `（${days}日前）` : '（今日）'}`;
}

// ================= STUDY SETS (choose a set first, then study inside it) =================
// A set is one class round ("第1回" ...) or "all". The chosen set sticks until
// the user presses "‹ セット一覧", and is remembered on this device.
const ROUND_INFO = {"第1回": {"title": "Chapter 5, part 2", "pages": "p.52〜54"}};
const SETS_KEY = 'narnia-sets';
let vocabSet = null;      // null = showing the set list
let practiceSet = null;
let practiceRound = 'all';

function roundsOf(...lists){
  const seen = [];
  lists.forEach(list => list.forEach(it => { if(it.round && !seen.includes(it.round)) seen.push(it.round); }));
  return seen;
}
function vocabRounds(){ return roundsOf(VOCAB); }
function practiceRounds(){ return roundsOf(UNDERLINE, QUIZ, COMPREHENSION, GRAMMAR, KOTEST); }
function newestRound(rounds){ return rounds.length ? rounds[rounds.length-1] : 'all'; }

function roundSubtitle(r, items){
  const info = ROUND_INFO[r];
  if(info) return [info.title, info.pages].filter(Boolean).join('・');
  const ch = [...new Set(items.filter(it=>it.round===r).map(it=>it.chapter))].sort((a,b)=>a-b);
  return ch.length ? `第${ch.join('・')}章` : '';
}

function saveSets(){
  try{ localStorage.setItem(SETS_KEY, JSON.stringify({vocab: vocabSet, practice: practiceSet})); }catch(e){}
}
function restoreSets(){
  try{
    const s = JSON.parse(localStorage.getItem(SETS_KEY) || '{}');
    if(s.vocab && (s.vocab==='all' || vocabRounds().includes(s.vocab))) vocabSet = s.vocab;
    if(s.practice && (s.practice==='all' || practiceRounds().includes(s.practice))) practiceSet = s.practice;
  }catch(e){}
}

// ---- pretty pill dropdowns (replace the native filter <select>s) ----
function prettySelect(sel, icon){
  if(!sel || sel._prettyRefresh) return;
  const wrap = document.createElement('div'); wrap.className = 'psel';
  const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'pselBtn';
  const menu = document.createElement('div'); menu.className = 'pselMenu'; menu.setAttribute('role','listbox');
  sel.parentNode.insertBefore(wrap, sel);
  wrap.append(btn, menu, sel);
  sel.classList.add('pselNative');
  const refresh = ()=>{
    const o = sel.options[sel.selectedIndex];
    btn.innerHTML = `<span class="pselIcon">${icon}</span><span class="pselLbl">${o ? escapeHtml(o.text) : ''}</span><svg class="pselChev" viewBox="0 0 12 12"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    wrap.style.display = sel.style.display === 'none' ? 'none' : '';
  };
  const outside = (e)=>{ if(!wrap.contains(e.target)) close(); };
  const onKey = (e)=>{ if(e.key === 'Escape'){ close(); btn.focus(); } };
  function close(){
    wrap.classList.remove('open');
    document.removeEventListener('pointerdown', outside, true);
    document.removeEventListener('keydown', onKey);
  }
  btn.onclick = ()=>{
    if(wrap.classList.contains('open')) return close();
    document.querySelectorAll('.psel.open').forEach(w => w._close && w._close());
    menu.innerHTML = [...sel.options].map((o,i)=>`<button type="button" role="option" class="pselOpt ${i===sel.selectedIndex?'on':''}" data-i="${i}">${escapeHtml(o.text)}</button>`).join('');
    menu.querySelectorAll('.pselOpt').forEach(b => b.onclick = ()=>{
      sel.selectedIndex = Number(b.dataset.i);
      close(); refresh();
      if(sel.onchange) sel.onchange({target: sel});
    });
    wrap.classList.add('open');
    wrap.classList.remove('alignRight');
    const r = menu.getBoundingClientRect();
    if(r.right > window.innerWidth - 8) wrap.classList.add('alignRight');
    document.addEventListener('pointerdown', outside, true);
    document.addEventListener('keydown', onKey);
    const on = menu.querySelector('.pselOpt.on'); if(on) on.focus();
  };
  wrap._close = close;
  new MutationObserver(refresh).observe(sel, {childList:true, subtree:true, characterData:true, attributes:true, attributeFilter:['style']});
  sel._prettyRefresh = refresh;
  refresh();
}

function applyTheme(k){
  const t = THEMES.find(x=>x.k===k) || THEMES[0];
  if(t.k === 'brown') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t.k);
  try{ localStorage.setItem('narnia-theme', t.k); }catch(e){}
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', t.color);
  const fav = LION_SVG.replace(/var\(--accent-dark\)/g, t.dark).replace(/var\(--accent\)/g, t.color);
  const link = document.getElementById('favicon');
  if(link) link.href = 'data:image/svg+xml,' + encodeURIComponent(fav);
  document.querySelectorAll('.swatch').forEach(b => b.classList.toggle('on', b.dataset.k === t.k));
}
function currentTheme(){ return document.documentElement.getAttribute('data-theme') || 'brown'; }
(function initThemePicker(){
  const pop = document.getElementById('themePop');
  document.getElementById('swatches').innerHTML = THEMES.map(t=>`<button class="swatch" data-k="${t.k}"><i style="background:${t.color}"></i>${t.label}</button>`).join('');
  document.querySelectorAll('.swatch').forEach(b => b.onclick = ()=>{ applyTheme(b.dataset.k); pop.classList.remove('open'); });
  const outside = (e)=>{ if(!pop.parentNode.contains(e.target)){ pop.classList.remove('open'); document.removeEventListener('pointerdown', outside, true); } };
  document.getElementById('themeBtn').onclick = ()=>{
    const open = !pop.classList.contains('open');
    pop.classList.toggle('open', open);
    if(open) document.addEventListener('pointerdown', outside, true);
  };
  applyTheme(currentTheme());
})();
